<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmación de Asistencia</title>

  <!-- Fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- html2canvas para descargar pases -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #fffaf7 0%, #f4e5df 45%, #ead7cf 100%);
      font-family: 'Montserrat', sans-serif;
      color: #5a2525;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .contenedor { width: 100%; max-width: 500px; }

    .tarjeta {
      background: rgba(255, 255, 255, .95);
      border: 1px solid #c9a24e;
      border-radius: 25px;
      padding: 35px 28px;
      box-shadow: 0 15px 45px rgba(90, 37, 37, .15);
    }

    .selector-cantidad {
      margin-bottom: 20px;
      text-align: center;
    }

    .selector-cantidad label {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      color: #c9a24e;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d8c0ad;
      background: #ffffff;
      outline: none;
      font-family: 'Montserrat', sans-serif;
      color: #5a2525;
      font-size: 14px;
      cursor: pointer;
    }

    select:focus {
      border-color: #c9a24e;
      box-shadow: 0 0 6px rgba(201, 162, 78, 0.3);
    }

    .tarjeta-integrante {
      background: #fffaf5;
      border: 1px solid #d8c0ad;
      border-radius: 15px;
      padding: 16px;
      margin-bottom: 15px;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tarjeta-integrante .titulo-integrante {
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      color: #c9a24e;
      font-weight: 600;
      margin-bottom: 10px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #d8c0ad;
      background: #ffffff;
      outline: none;
      font-family: 'Montserrat', sans-serif;
      color: #5a2525;
      font-size: 14px;
      margin-bottom: 12px;
    }

    input[type="text"]:focus {
      border-color: #c9a24e;
      box-shadow: 0 0 6px rgba(201, 162, 78, 0.3);
    }

    .opciones { display: flex; gap: 10px; }
    .opcion { flex: 1; }
    .opcion input { display: none; }
    .opcion label {
      display: block;
      text-align: center;
      padding: 10px 5px;
      border: 1px solid #d8c0ad;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      background: #ffffff;
      transition: .2s;
    }

    .opcion input:checked + label {
      background: #9b2020;
      border-color: #9b2020;
      color: #ffffff;
      font-weight: 600;
    }

    .boton {
      width: 100%;
      border: 0;
      border-radius: 30px;
      padding: 16px;
      background: #9b2020;
      color: white;
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(155, 32, 32, 0.25);
    }

    .boton:hover { background: #801818; }
    .boton:disabled { opacity: .6; cursor: not-allowed; }

    .mensaje {
      display: none;
      text-align: center;
      margin-top: 10px;
      padding: 15px;
      border-radius: 12px;
      background: #fff7f2;
      border: 1px solid #d9bda8;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .mensaje.visible { display: block; }

    .lista-pases { display: none; margin-top: 25px; }
    .lista-pases.visible { display: block; }

    .tarjeta-pase-individual { margin-bottom: 30px; }

    .contenido-pase {
      position: relative;
      width: 100%;
      padding: 35px 20px 25px;
      text-align: center;
      border: 2px solid #c9a24e;
      border-radius: 20px;
      background: linear-gradient(145deg, #fffdf9 0%, #faf0e8 50%, #f3e3da 100%);
      box-shadow: 0 10px 30px rgba(128, 72, 89, .12);
    }

    .pase-adorno { font-size: 20px; color: #c9a24e; margin-bottom: 5px; }

    .pase-titulo {
      font-family: 'Cormorant Garamond', serif;
      color: #c9a24e;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .pase-linea { width: 80px; height: 1px; background: #c9a24e; margin: 0 auto 20px; }

    .pase-nombre {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 600;
      color: #5a2525;
      margin: 10px 0 5px;
    }

    .pase-indicador {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      background: #9b2020;
      color: #ffffff;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .pase-intransferible {
      margin-top: 20px;
      padding-top: 12px;
      border-top: 1px dashed #d8c0ad;
      font-size: 11px;
      color: #8c5d5d;
      font-style: italic;
      line-height: 1.4;
    }

    .boton-descargar {
      width: 100%;
      border: 1px solid #c9a24e;
      border-radius: 30px;
      padding: 12px 20px;
      margin-top: 12px;
      background: #9b2020;
      color: #fffaf2;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="contenedor">
    <div class="tarjeta">
      <div id="formularioCampos">
        <!-- Selector de cantidad de personas (Hasta 3) -->
        <div class="selector-cantidad">
          <label for="selectCantidad">¿Cuántos asistentes confirmarán?</label>
          <select id="selectCantidad" onchange="generarCampos(this.value)">
            <option value="1" selected>1 Persona</option>
            <option value="2">2 Personas</option>
            <option value="3">3 Personas</option>
          </select>
        </div>

        <div id="contenedorIntegrantes"></div>
        <button class="boton" id="botonEnviar" onclick="enviarRegistro()">Confirmar respuestas</button>
      </div>

      <div id="mensaje" class="mensaje"></div>
      <div id="listaPases" class="lista-pases"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz6ep-NcMK-kVhKe6LaYHU3HktIUUPv0Q3IL-ttau2o5VtGe7IPX0MgwKzC3ZXNVo_v/exec";

    let cantidadSeleccionada = 1; // Inicia por defecto en 1 persona

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const pasesParam = parseInt(urlParams.get('pases'));

      if (!isNaN(pasesParam) && pasesParam >= 1 && pasesParam <= 3) {
        cantidadSeleccionada = pasesParam;
      }

      const selector = document.getElementById('selectCantidad');
      if (selector) selector.value = cantidadSeleccionada;

      generarCampos(cantidadSeleccionada);
    });

    // Genera los campos divididos por Nombre, Primer Apellido y Segundo Apellido
    function generarCampos(cantidad) {
      cantidadSeleccionada = parseInt(cantidad);
      const contenedor = document.getElementById('contenedorIntegrantes');
      contenedor.innerHTML = '';

      for (let i = 1; i <= cantidadSeleccionada; i++) {
        const div = document.createElement('div');
        div.className = 'tarjeta-integrante';
        div.innerHTML = `
          <div class="titulo-integrante">${cantidadSeleccionada === 1 ? 'Asistente' : `Asistente ${i}`}</div>
          <input type="text" id="nombre_${i}" placeholder="Nombre(s)" autocomplete="off">
          <input type="text" id="apellidoPaterno_${i}" placeholder="Primer Apellido" autocomplete="off">
          <input type="text" id="apellidoMaterno_${i}" placeholder="Segundo Apellido" autocomplete="off">
          <div class="opciones">
            <div class="opcion">
              <input type="radio" name="asist_${i}" id="si_${i}" value="Sí" checked>
              <label for="si_${i}">Sí asistiré</label>
            </div>
            <div class="opcion">
              <input type="radio" name="asist_${i}" id="no_${i}" value="No">
              <label for="no_${i}">No asistiré</label>
            </div>
          </div>
        `;
        contenedor.appendChild(div);
      }
    }

    function llamarAPI(parametros) {
      return new Promise((resolve, reject) => {
        const callback = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 9999);
        const script = document.createElement('script');
        const query = new URLSearchParams({ ...parametros, callback });
        const tiempo = setTimeout(() => { limpiar(); reject("Tiempo agotado"); }, 12000);

        window[callback] = function(data) {
          clearTimeout(tiempo);
          limpiar();
          resolve(data);
        };

        function limpiar() {
          delete window[callback];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = function() {
          clearTimeout(tiempo);
          limpiar();
          reject("Error de conexión");
        };

        script.src = API_URL + '?' + query.toString();
        document.body.appendChild(script);
      });
    }

    async function enviarRegistro() {
      const mensaje = document.getElementById('mensaje');
      const listaPases = document.getElementById('listaPases');
      const boton = document.getElementById('botonEnviar');

      const listaPersonas = [];

      for (let i = 1; i <= cantidadSeleccionada; i++) {
        const nombreVal = document.getElementById(`nombre_${i}`).value.trim();
        const apPaternoVal = document.getElementById(`apellidoPaterno_${i}`).value.trim();
        const apMaternoVal = document.getElementById(`apellidoMaterno_${i}`).value.trim();
        const asistVal = document.querySelector(`input[name="asist_${i}"]:checked`).value;

        if (!nombreVal || !apPaternoVal || !apMaternoVal) {
          mostrarMensaje(`Por favor completa el Nombre, Primer Apellido y Segundo Apellido ${cantidadSeleccionada > 1 ? `del Asistente ${i}` : ''}.`);
          return;
        }

        const nombreCompleto = `${nombreVal} ${apPaternoVal} ${apMaternoVal}`;

        listaPersonas.push({
          nombre: nombreCompleto,
          asistencia: asistVal
        });
      }

      boton.disabled = true;
      boton.textContent = 'Enviando...';

      try {
        await llamarAPI({
          action: 'registrarIndividuales',
          personas: JSON.stringify(listaPersonas)
        });

        document.getElementById('formularioCampos').style.display = 'none';

        const confirmados = listaPersonas.filter(p => p.asistencia === 'Sí');

        if (confirmados.length === 0) {
          mostrarMensaje('Muchas gracias por responder. Lamentamos que no puedan acompañarnos.');
          return;
        }

        mostrarMensaje('¡Gracias por confirmar! A continuación tienes tus pases individuales (En caso de llegar en diferente horario al evento)');

        listaPases.className = 'lista-pases visible';
        listaPases.innerHTML = '';

        confirmados.forEach((persona, index) => {
          const divPase = document.createElement('div');
          divPase.className = 'tarjeta-pase-individual';
          divPase.innerHTML = `
            <div id="contenidoPase_${index}" class="contenido-pase">
              <div class="pase-adorno">✦</div>
              <div class="pase-titulo">Pase de Entrada</div>
              <div class="pase-linea"></div>
              <div class="pase-nombre">${escapar(persona.nombre)}</div>
              <div class="pase-indicador">ACCESO INDIVIDUAL PERSONAL</div>
              <div class="pase-intransferible">
                Este pase es intransferible, únicamente está destinado para uso de las personas invitadas al evento.
              </div>
            </div>
            <button type="button" class="boton-descargar" onclick="descargarPaseIndividual(${index}, '${escapar(persona.nombre)}', event)">
              Descargar Pase de ${escapar(persona.nombre)}
            </button>
          `;
          listaPases.appendChild(divPase);
        });

      } catch (err) {
        console.error(err);
        mostrarMensaje('Hubo un error al guardar la información. Inténtalo de nuevo.');
        boton.disabled = false;
        boton.textContent = 'Confirmar respuestas';
      }
    }

    function mostrarMensaje(texto) {
      const mensaje = document.getElementById('mensaje');
      mensaje.className = 'mensaje visible';
      mensaje.textContent = texto;
    }

    async function descargarPaseIndividual(index, nombrePersona, ev) {
      const contenido = document.getElementById('contenidoPase_' + index);
      if (!contenido) return;

      const btn = ev.target;
      const textoOriginal = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Generando imagen...';

      try {
        const canvas = await html2canvas(contenido, {
          scale: 3,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });

        canvas.toBlob(function(blob) {
          if (!blob) throw new Error('Error al generar la imagen');
          const url = URL.createObjectURL(blob);
          const enlace = document.createElement('a');
          enlace.href = url;
          enlace.download = 'Pase-' + nombrePersona.replace(/[^a-zA-Z0-9]/g, '-') + '.png';
          document.body.appendChild(enlace);
          enlace.click();
          document.body.removeChild(enlace);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, 'image/png');

      } catch (error) {
        alert('No se pudo descargar automáticamente. Puedes tomarle captura de pantalla.');
      } finally {
        btn.disabled = false;
        btn.textContent = textoOriginal;
      }
    }

    function escapar(texto) {
      return String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/'/g, '&#39;');
    }
  </script>
</body>

</html>
